name: Build and Run noVNC Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t prbinu/novnc-desktop -f Dockerfile .

      - name: Run noVNC desktop container
        run: |
          docker run -d --rm \
            --name novnc-desktop \
            -p 8080:8080 \
            -e "TZ=America/Los_Angeles" \
            prbinu/novnc-desktop

      - name: Wait for noVNC to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "noVNC is ready on http://localhost:8080"
              exit 0
            fi
            echo "Waiting for noVNC to start... ($i/30)"
            sleep 10
          done

          echo "noVNC did not become ready in time."
          echo "--- container logs ---"
          docker logs novnc-desktop || true
          echo "--- docker ps ---"
          docker ps -a
          exit 1
